name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: codebuild-adrise-github-runner-${{ github.run_id }}-${{ github.run_attempt }} image:ubuntu-7.0 instance-size:large
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Clone and checkout to current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Get Sbt Global Settings
        uses: adRise/sbt-global-settings@v0.3.0

      - name: Generate artifact
        run: |
          sbt clean compile test
        env:
          ADRISE_INFRA: "true"
          AKKA_TEST_FACTOR: 10.0
          JAVA_OPTS: -Xms4G -Xmx4G -Xss8M -XX:ReservedCodeCacheSize=256M -XX:+UseG1GC -Dfile.encoding=UTF-8
